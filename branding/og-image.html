<!DOCTYPE html>
<!-- Social preview (1200×630). Render at exactly that size; see branding/export.html for the method. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #F5F6F3; color: #121614; font-family: Geist, 'Helvetica Neue', Arial, sans-serif; position: relative; }
  .copy { position: absolute; left: 80px; top: 92px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .brand img { width: 56px; height: 56px; border-radius: 14px; }
  h1 { margin-top: 56px; font-size: 72px; line-height: 1; letter-spacing: -0.045em; font-weight: 800; }
  p { margin-top: 26px; font-size: 27px; line-height: 1.4; color: #545D58; max-width: 500px; }
  .tags { margin-top: 34px; display: flex; gap: 12px; }
  .tags span { padding: 10px 18px; border-radius: 999px; border: 1.5px solid rgba(18,22,20,.12); font-size: 20px; font-weight: 600; color: #087A5C; background: #fff; }
  .glow { position: absolute; right: 40px; top: 60px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(closest-side, rgba(8,122,92,.16), rgba(8,122,92,0)); }
  .phone { position: absolute; padding: 9px; border-radius: 44px; background: #1A1F1D; box-shadow: 0 2px 6px rgba(18,30,25,.08), 0 40px 80px -28px rgba(18,30,25,.45); }
  .phone img { display: block; width: 100%; border-radius: 35px; }
  .front { width: 270px; left: 720px; top: 70px; z-index: 2; }
  .back { width: 240px; left: 900px; top: 130px; transform: rotate(7deg); opacity: .94; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="spendtrak-icon.svg" alt="">SpendTrak</div>
    <h1>Know where your money goes.</h1>
    <p>A free, private expense tracker for the web and Android.</p>
    <div class="tags"><span>No sign-up</span><span>Works offline</span><span>No ads</span></div>
  </div>
  <div class="glow"></div>
  <div class="phone back"><img src="../public/screens/android-categories.jpg" alt=""></div>
  <div class="phone front"><img src="../public/screens/android-home.jpg" alt=""></div>
</body>
</html>
