<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed (no rounded corners): launchers, stores and PWA "maskable" icons apply their own shape. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33227A"/>
      <stop offset="1" stop-color="#120A2E"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="50%">
      <stop offset="0" stop-color="#7C6CF5" stop-opacity=".5"/>
      <stop offset="1" stop-color="#7C6CF5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lilac" gradientUnits="userSpaceOnUse" x1="334" y1="150" x2="226" y2="262">
      <stop offset="0" stop-color="#DCD8FF"/>
      <stop offset="1" stop-color="#8F81FF"/>
    </linearGradient>
    <linearGradient id="mint" gradientUnits="userSpaceOnUse" x1="300" y1="262" x2="190" y2="364">
      <stop offset="0" stop-color="#52F5CB"/>
      <stop offset="1" stop-color="#0FB38B"/>
    </linearGradient>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><feGaussianBlur stdDeviation="7"/></filter>
    <mask id="onLilac" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <path d="M334 178 C306 140 222 140 198 184 C176 224 212 254 256 260" fill="none" stroke="#fff" stroke-width="60" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="240" r="236" fill="url(#glow)"/>
  <g transform="translate(256 257) scale(.82) translate(-256 -257)">
    <path d="M334 178 C306 140 222 140 198 184 C176 224 212 254 256 260" fill="none" stroke="url(#lilac)" stroke-width="60" stroke-linecap="round"/>
    <g mask="url(#onLilac)"><path d="M256 260 C282 264 304 274 316 292" fill="none" stroke="#0A0524" stroke-opacity=".5" stroke-width="60" stroke-linecap="round" filter="url(#soft)" transform="translate(-4 9)"/></g>
    <path d="M256 260 C300 266 336 296 312 336 C288 376 204 374 178 334" fill="none" stroke="url(#mint)" stroke-width="60" stroke-linecap="round"/>
  </g>
</svg>
