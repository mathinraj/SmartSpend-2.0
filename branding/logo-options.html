<!DOCTYPE html>

<title>SpendTrak logo options</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #120c2c; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; padding: 36px 40px 48px; }
  header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 26px; }
  header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.4px; }
  header p { color: rgba(255,255,255,.55); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
  .card { background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.08); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .top { display: flex; align-items: center; gap: 10px; }
  .num { width: 28px; height: 28px; border-radius: 9px; background: rgba(162,155,254,.18); color: #c8c3ff; font-weight: 800; font-size: 13px; display: grid; place-items: center; flex-shrink: 0; }
  .name { font-weight: 700; font-size: 15px; }
  .hero { width: 100%; aspect-ratio: 1; display: grid; place-items: center; background: rgba(255,255,255,.03); border-radius: 14px; }
  .hero svg { width: 74%; height: 74%; }
  .idea { font-size: 12px; line-height: 1.45; color: rgba(255,255,255,.6); min-height: 34px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row svg { width: 44px; height: 44px; }
  .circle { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; }
  .circle svg { width: 60px; height: 60px; margin: -8px; }
  .light { background: #f3f2fb; border-radius: 10px; padding: 6px; display: flex; gap: 6px; }
  .light svg { width: 32px; height: 32px; }
  .tag { margin-left: auto; font-size: 10.5px; color: rgba(255,255,255,.4); text-transform: uppercase; letter-spacing: 1px; }
</style>
</head>

    ['Hex S', 'A soft hexagon badge with an S. Feels solid and trustworthy.'],
